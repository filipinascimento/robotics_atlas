<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem("robotics-atlas-theme"); } catch {}
        document.documentElement.dataset.theme = preference === "light" || preference === "dark"
          ? preference : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
    <meta
      name="description"
      content="Explore robotics research communities, institutional collaborations, geography, and publication timelines in one connected atlas."
    />
    <meta name="theme-color" content="#0c131b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robotics Atlas — Research Observatory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
